<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: x-large;
            display: flex;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
        }
        .calculator{
        padding: 25px;
        border-radius: 50px;
        width: 200 px;
        background-color: #222;
        box-shadow: 0 15px 30px rgba(0,0,0,0.3) ;
        }
        h1{
            background-color: white;
            color:black;
            display: inline-block;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            padding: 18px 45px;
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .display{
            width: 100%;
            height:70px;
            margin-bottom: 20px;
            padding: 2px 2px;
            background-color: white;
            margin-bottom: 20px;
            border:none;
            border-radius: 10px;
            font-size: 32px;
            text-align: center;
            outline: none;

        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap:12px;
        }
        button{
            height:60px;
        border:none;
    border-radius: 100%;  
background-color: #444; 
color:white;
font-size: 22px; 
cursor:pointer;

}
button:hover{
    background-color:#222;
}
.orange{
    background-color: orange;
}
.grey{
    background-color: grey;
}


    </style>
</head>
<body>
    <div class="calculator">
        <h1>Welcome to Calculator</h1>
        <div class="calc">
        <input type="text" class="display">
        <div class="buttons">
                <button class="grey">AC</button>
                <button class="grey">&larr;</button>
                    <button class="grey">%</button>
                    <button class="orange">&divide;</button>

    

                <button class="numbers">7</button>
                <button class="numbers">8</button>
                <button class="numbers">9</button>
                <button class="orange">x</button>
            
            
                <button class="numbers">4</button>
                <button class="numbers">5</button>
                <button class="numbers">6</button>
                <button class="orange">-</button>
            
            
                <button class="numbers">1</button>
                <button class="numbers">2</button>
                <button class="numbers">3</button>
                <button class="orange">+</button>
            
            
                <button class="numbers">0</button>
                <button class="numbers">00</button>
                <button class="numbers">.</button>
                <button class="orange">=</button>
            
        </div>
        </div>
    </div>
</body>
</html>
